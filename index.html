function splitCSV(line){const out=[];let cur="",q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(q){if(ch==='"'&&line[i+1]==='"'){cur+='"';i++}else if(ch==='"')q=false;else cur+=ch}else{if(ch===',')out.push(cur),cur="";else if(ch==='"')q=true;else cur+=ch}}out.push(cur);return out}
function parseCSV(txt){
  const lines=txt.replace(/\r/g,"").split("\n").filter(x=>x.trim());
  const head=splitCSV(lines.shift()).map(h=>h.trim().toLowerCase());
  const iF=head.indexOf("from"),iT=head.indexOf("to"),iR=head.indexOf("rickshaw"),iC=head.indexOf("cng"),iE=head.indexOf("ecar");
  if(iF<0||iT<0||iR<0)throw new Error("bad header");
  const num=v=>{const x=(v||"").trim();if(x==="")return null;const n=Number(x);return Number.isFinite(n)?n:null};
  return lines.map(splitCSV).filter(c=>c[iF]&&c[iT]).map(c=>({from:c[iF].trim(),to:c[iT].trim(),rickshaw:num(c[iR]),cng:iC>=0?num(c[iC]):null,ecar:iE>=0?num(c[iE]):null}));
}
async function loadRows(fb){
  if(SHEET_CSV.includes("PUBLISHED_ID"))return fb;
  try{
    const ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),8000);
    const res=await fetch(SHEET_CSV,{cache:"no-store",signal:ctrl.signal});
    clearTimeout(tm);
    if(!res.ok)throw new Error("HTTP "+res.status);
    const rows=parseCSV(await res.text());
    if(!rows.length)throw new Error("empty sheet");
    return rows;
  }catch(e){console.warn("Fare sheet unavailable, using built-in data:",e);return fb}
}

const $=id=>document.getElementById(id);
let L="bn";try{L=localStorage.getItem("lang")||"bn"}catch(e){}window.__L=()=>L;
const t=k=>T[L][k];
const bnd=n=>Number(n).toLocaleString("bn-BD");
const nf=n=>L==="bn"?bnd(n):String(n);
const BNN=l=>DISP[l]||l;
const nm=l=>L==="bn"?BNN(l):(EN[l]||l);
const S={from:"",to:"",via:""};
let pax=1,last=null,fares=[],VC=[];

function findDirect(from,to){
  const m=fareData.find(d=>d.from===from&&d.to===to);
  if(m&&(m.rickshaw!=null||m.cng!=null||m.ecar!=null))return{...m};
  const rev=fareData.find(d=>d.from===to&&d.to===from);
  if(rev)return{from,to,rickshaw:rev.rickshaw,cng:rev.cng,ecar:rev.ecar};
  return null;
}
function getRickshaw(from,to){
  const m=fareData.find(d=>d.from===from&&d.to===to);
  if(m&&m.rickshaw!=null)return m.rickshaw;
  const rev=fareData.find(d=>d.from===to&&d.to===from);
  if(rev&&rev.rickshaw!=null)return rev.rickshaw;
  return null;
}
const calcRickshaw=(b,p)=>b==null?null:p<=2?b:b+(p-2)*(b<=25?5:10);
const cngOk=(a,b)=>CNG_PATH.includes(a)&&CNG_PATH.includes(b);
const ecarOk=(a,b)=>!(a==="১নং গেইট"||b==="১নং গেইট");

const match=(l,q)=>{q=q.toLowerCase();return !q||BNN(l).includes(q)||l.includes(q)||(EN[l]||"").toLowerCase().includes(q)};
const resolve=x=>{x=x.trim().toLowerCase();return allLocations.find(l=>x&&(l.toLowerCase()===x||BNN(l).toLowerCase()===x||(EN[l]||"").toLowerCase()===x))||""};

function combo(w,list,onPick){
  const inp=$(w+"Input"),box=$(w+"Drop");let items=[],idx=-1;
  const mark=()=>{[...box.children].forEach((li,i)=>li.setAttribute("aria-selected",i===idx));const a=box.children[idx];if(a){a.scrollIntoView({block:"nearest"});inp.setAttribute("aria-activedescendant",a.id)}};
  const open=()=>{
    items=list(inp.value.trim());idx=-1;
    box.innerHTML=items.length?items.map((x,i)=>`<li role="option" id="${w}o${i}" data-i="${i}"><span>${x.label}</span>${x.tag?`<b>${x.tag}</b>`:""}</li>`).join(""):`<li class="none">${t("none")}</li>`;
    box.hidden=false;inp.setAttribute("aria-expanded","true");
  };
  const close=()=>{box.hidden=true;inp.setAttribute("aria-expanded","false")};
  const pick=x=>{inp.value=nm(x.v);close();onPick(x.v)};
  inp.addEventListener("focus",()=>{inp.select();open()});
  inp.addEventListener("input",()=>{open();onPick(resolve(inp.value),true)});
  inp.addEventListener("blur",close);
  inp.addEventListener("keydown",e=>{
    if(box.hidden&&e.key==="ArrowDown"){open();return}
    if(e.key==="ArrowDown"){e.preventDefault();idx=Math.min(items.length-1,idx+1);mark()}
    else if(e.key==="ArrowUp"){e.preventDefault();idx=Math.max(0,idx-1);mark()}
    else if(e.key==="Enter"&&!box.hidden){e.preventDefault();const x=items[idx>=0?idx:0];if(x)pick(x)}
    else if(e.key==="Escape")close();
  });
  box.addEventListener("mousedown",e=>{e.preventDefault();const li=e.target.closest("li[data-i]");if(li)pick(items[+li.dataset.i])});
}
const plain=q=>allLocations.filter(l=>match(l,q)).map(l=>({v:l,label:nm(l)}));
combo("from",plain,v=>{S.from=v;onChange()});
combo("to",plain,v=>{S.to=v;onChange()});
combo("via",q=>{
  const priced=VC.filter(c=>match(c.v,q)).map(c=>({v:c.v,label:nm(c.v),tag:"৳"+nf(c.sum)}));
  const pricedSet=new Set(VC.map(c=>c.v));
  const rest=allLocations.filter(l=>l!==S.from&&l!==S.to&&!pricedSet.has(l)&&match(l,q)).map(l=>({v:l,label:nm(l)}));
  return priced.concat(rest);
},(v,typing)=>{
  if(!v){S.via="";renderVia();return}
  S.via=v;
  if(!typing)$("viaInput").value=nm(v);
  renderVia();
});

function onChange(){
  const{from,to}=S,ok=from&&to&&from!==to;
  $("show").disabled=!ok;
  const clearVia=()=>{S.via="";$("viaInput").value="";$("viaBox").hidden=true};
  if(!ok)return clearVia();
  if(findDirect(from,to)&&getRickshaw(from,to)!=null)return clearVia();
  VC=allLocations.filter(h=>h!==from&&h!==to).map(h=>{const r1=getRickshaw(from,h),r2=getRickshaw(h,to);return r1!=null&&r2!=null?{v:h,r1,r2,sum:r1+r2}:null}).filter(Boolean).sort((a,b)=>a.sum-b.sum||HUBS.includes(b.v)-HUBS.includes(a.v));
  if(S.via&&S.via!==from&&S.via!==to){/* keep user-chosen via even if not in priced list */}
  else if(S.via&&!VC.some(c=>c.v===S.via)){S.via="";$("viaInput").value=""}
  $("viaBox").hidden=false;renderVia();
}
function renderVia(){
  $("viaChips").innerHTML=VC.slice(0,8).map((c,i)=>`<button type="button" class="chip" data-i="${i}" aria-pressed="${S.via===c.v}">${nm(c.v)} <b>৳${nf(c.sum)}</b></button>`).join("");
  $("viaNote").textContent=VC.length?t("viaOk"):t("viaNone");
}
$("viaChips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;const v=VC[+b.dataset.i].v;S.via=S.via===v?"":v;$("viaInput").value=S.via?nm(S.via):"";renderVia()};

/* ticket */
function bpModes(a,b){
  const d=findDirect(a,b)||{}, rk=getRickshaw(a,b);
  return{
    rk: rk!=null?calcRickshaw(rk,pax):null,
    cg: d.cng!=null&&cngOk(a,b)?d.cng*pax:null,
    ec: d.ecar!=null&&ecarOk(a,b)?d.ecar*pax:null
  };
}
const bpAdd=(x,y)=>({rk:x.rk!=null&&y.rk!=null?x.rk+y.rk:null,cg:x.cg!=null&&y.cg!=null?x.cg+y.cg:null,ec:x.ec!=null&&y.ec!=null?x.ec+y.ec:null});
const bpCheap=m=>{const v=[m.rk,m.cg,m.ec].filter(x=>x!=null);return v.length?Math.min(...v):null};
const bpLine=m=>[m.rk!=null?`🛺 ৳${nf(m.rk)}`:null,m.cg!=null?`⛽ ৳${nf(m.cg)}`:null,m.ec!=null?`⚡ ৳${nf(m.ec)}`:null].filter(Boolean).join(" · ")||"—";
function bestBypass(from,to){
  const c=allLocations.filter(h=>h!==from&&h!==to).map(v=>{const a=bpModes(from,v),b=bpModes(v,to),t=bpAdd(a,b);return{v,a,b,t,cost:bpCheap(t)}})
    .filter(x=>x.cost!=null).sort((x,y)=>x.cost-y.cost);
  return c[0]||null;
}
function showTicket(){
  const{from,to,via}=S;
  if(!from||!to||from===to)return;
  let r={type:"none",from,to,rickshaw:null,cng:null,ecar:null};
  if(via){
    const r1=getRickshaw(from,via),r2=getRickshaw(via,to),l1=findDirect(from,via)||{},l2=findDirect(via,to)||{};
    if(r1!=null&&r2!=null)r={type:"via",from,to,via,r1,r2,rickshaw:r1+r2,cng:(l1.cng&&l2.cng)?l1.cng+l2.cng:null,ecar:(l1.ecar&&l2.ecar)?l1.ecar+l2.ecar:null};
  }else{
    const d=findDirect(from,to),x=getRickshaw(from,to);
    if(d||x!=null)r={type:"direct",from,to,rickshaw:x,cng:d?d.cng:null,ecar:d?d.ecar:null};
  }
  last=r; if(r.type==="none"&&window.goatcounter)goatcounter.count({path:"nofare",title:nm(from)+" → "+nm(to),event:true});
  const rf=calcRickshaw(r.rickshaw,pax);
  let cg=r.cng,ec=r.ecar;
  if(cg!=null&&!cngOk(from,to)&&r.type!=="via")cg=null;
  if(ec!=null&&!ecarOk(from,to))ec=null;
  fares=[rf,cg,ec];
  $("tFrom").textContent=nm(from);$("tTo").textContent=nm(to);
  const seat=a=>pax>1?`${t("per")}<br>${nf(pax)} ${t("pp")} = ৳${nf(a*pax)}`:t("per");
  const card=(i,ic,amt,sub)=>`<div class="fare v${i} ${amt!=null?"on":"off"}"><div class="ic" aria-hidden="true">${ic}</div><div class="vn">${t("v"+i)}</div><div class="amt">${amt!=null?"৳"+nf(amt):t("na")}</div>${amt!=null&&sub?`<div class="sb2">${sub}</div>`:""}</div>`;
  $("tFares").innerHTML=card(0,"🛺",rf,pax>2?`${nf(pax)} ${t("pxs")}`:t("full"))+card(1,"⛽",cg,cg!=null?seat(cg):"")+card(2,"⚡",ec,ec!=null?seat(ec):"");
  $("tMeta").innerHTML=`<span>${t("paxMeta")}: <strong>${nf(pax)} ${t("pxs")}</strong></span><span>${r.type==="via"?t("viaWord"):r.type==="direct"?t("direct"):"—"}</span>`;
  let n="";
  if(r.type==="via")n+=`<div class="mx">🔄 <strong>${nm(from)}</strong> → <strong>${nm(r.via)}</strong> → <strong>${nm(to)}</strong><br><small>${nm(from)}→${nm(r.via)}: ৳${nf(r.r1)} | ${nm(r.via)}→${nm(to)}: ৳${nf(r.r2)}</small></div>`;
  else if(r.type==="none")n+=`<div class="mx bad">${t("noRoute")}</div>`;
  if(r.rickshaw!=null&&pax>2){const k=r.rickshaw<=25?5:10;n+=`<div class="mx nt">${t("ex")(nf(pax),nf(r.rickshaw),nf(pax-2),nf(k),nf(rf))}</div>`}
  if(!via){
    const dir=bpModes(from,to), dirBest=bpCheap(dir), bp=bestBypass(from,to);
    if(bp&&(dirBest==null||bp.cost<dirBest)){
      const en=L!=="bn";
      n+=`<div class="mx bp" style="border:2px dashed #F4B400;border-radius:12px;padding:10px;background:rgba(244,180,0,.12)"><strong>${en?"🔀 Bypass option":"🔀 বিকল্প পথ (বাইপাস)"}</strong><br>${nm(from)} → <strong>${nm(bp.v)}</strong> → ${nm(to)}<br><small>${en?"Leg 1":"ধাপ ১"}: ${bpLine(bp.a)}</small><br><small>${en?"Leg 2":"ধাপ ২"}: ${bpLine(bp.b)}</small><br><small>${en?"Total":"মোট"} (${nf(pax)} ${t("pxs")}): ${bpLine(bp.t)}${dirBest!=null?` · ${en?"direct best":"সরাসরি সেরা"}: ৳${nf(dirBest)}`:` · ${en?"no direct ride":"সরাসরি বাহন নেই"}`}</small><br><small>${en?"You change vehicles at "+nm(bp.v)+"; it may take longer.":nm(bp.v)+" থেকে বাহন বদলাতে হবে; সময় বেশি লাগতে পারে।"}</small></div>`;
    }
  }
  $("tNote").innerHTML=n;
  window.cuShownOk=r.type!=="none";
  $("tk").showModal();
}

/* theme */
(function(){
  let th="auto";
  try{th=localStorage.getItem("theme")||"auto"}catch(e){}
  const apply=()=>{
    const root=document.documentElement;
    if(th==="auto"){root.removeAttribute("data-theme")}

    const btn=$("theme");

  };
  apply();
  const tb=$("theme");

/* recent routes */
const REC_KEY="cu_fare_recent";
function loadRecent(){
  try{return JSON.parse(localStorage.getItem(REC_KEY)||"[]")}catch(e){return []}
}
function saveRecent(from,to){
  if(!from||!to)return;
  let list=loadRecent().filter(r=>!(r.from===from&&r.to===to));
  list.unshift({from,to});
  list=list.slice(0,6);
  try{localStorage.setItem(REC_KEY,JSON.stringify(list))}catch(e){}
  renderRecent();
}
function renderRecent(){
  const box=$("recentBox"),chips=$("recentChips");
  if(!box||!chips)return;
  const list=loadRecent().filter(r=>allLocations.includes(r.from)&&allLocations.includes(r.to));
  if(!list.length){box.hidden=true;return}
  box.hidden=false;
  chips.innerHTML=list.map((r,i)=>`<button type="button" class="rchip" data-i="${i}">${nm(r.from)} → ${nm(r.to)}</button>`).join("");
}
if($("recentChips"))$("recentChips").onclick=e=>{
  const b=e.target.closest(".rchip");if(!b)return;
  const list=loadRecent();const r=list[+b.dataset.i];if(!r)return;
  S.from=r.from;S.to=r.to;S.via="";
  $("fromInput").value=nm(r.from);$("toInput").value=nm(r.to);$("viaInput").value="";
  onChange();
};

  const done=()=>{tCopy.textContent=t("copied");tCopy.classList.add("copy-ok");setTimeout(()=>{tCopy.textContent=t("copy");tCopy.classList.remove("copy-ok")},1500)};
  if(navigator.clipboard)navigator.clipboard.writeText(text).then(done).catch(()=>{});
  else done();
};

/* save recent on ticket show - patch */
const _showTicket=showTicket;
showTicket=function(){

<div id="installBar" hidden role="region" aria-label="Install app"><span id="installMsg"></span><button id="installBtn" type="button">ইনস্টল</button><button id="installDismiss" type="button">পরে</button></div>
<script>
(function(){
  const isStandalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  let deferred=null;
  const bar=document.getElementById('installBar'),btn=document.getElementById('installBtn'),msg=document.getElementById('installMsg'),dis=document.getElementById('installDismiss');
  const dismissed=()=>{try{return localStorage.getItem('cuInstallDismissed')==='1'}catch(e){return false}};
  const remember=()=>{try{localStorage.setItem('cuInstallDismissed','1')}catch(e){}};
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});
  window.addEventListener('appinstalled',()=>{bar.hidden=true;deferred=null});
  window.cuMaybeInstall=function(){
    if(isStandalone||dismissed()||(!deferred&&!isIOS))return;
    msg.textContent=window.__L()==='bn'?'📲 অ্যাপটি ফোনে রাখুন, এক ট্যাপে খুলুন':'📲 Add the app to your phone for one-tap access';
    btn.textContent=window.__L()==='bn'?'ইনস্টল':'Install';
    dis.textContent=window.__L()==='bn'?'পরে':'Later';
    bar.hidden=false;
  };
  btn.onclick=async()=>{
    if(deferred){deferred.prompt();const c=await deferred.userChoice;deferred=null;bar.hidden=true;if(c.outcome!=='accepted')remember();return}
    alert(window.__L()==='bn'?'iPhone-এ: Safari-র নিচে শেয়ার বোতাম (⬆) চাপুন, তারপর "Add to Home Screen" বেছে নিন।':'On iPhone: tap the Share button (⬆) in Safari, then "Add to Home Screen".');
  };
  dis.onclick=()=>{bar.hidden=true;remember()};
  document.getElementById('tk').addEventListener('close',()=>{if(window.cuShownOk)cuMaybeInstall()});
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))
    window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
